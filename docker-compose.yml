services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - CR_CELERY_BROKER_URL=redis://redis:6379/1
      - CR_CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: celery -A code_review_agent.core.worker worker --loglevel=info --concurrency=4
    environment:
      - CR_CELERY_BROKER_URL=redis://redis:6379/1
      - CR_CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
