name: Notify Code Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: PR — 通知 + 触发自动 Review
        if: github.event_name == 'pull_request'
        env:
          APP_ID: ${{ secrets.FEISHU_GIT_LISTENER_APP_ID }}
          APP_SECRET: ${{ secrets.FEISHU_GIT_LISTENER_APP_SECRET }}
          CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import requests, json

          token_resp = requests.post(
              'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal',
              json={'app_id': '${{ secrets.FEISHU_GIT_LISTENER_APP_ID }}',
                    'app_secret': '${{ secrets.FEISHU_GIT_LISTENER_APP_SECRET }}'}
          ).json()
          token = token_resp['tenant_access_token']

          pr_url = "${{ github.event.pull_request.html_url }}"
          pr_title = "${{ github.event.pull_request.title }}"
          actor = "${{ github.actor }}"
          repo = "${{ github.repository }}"
          adds = "${{ github.event.pull_request.additions }}"
          dels = "${{ github.event.pull_request.deletions }}"

          lines = [
              "<at user_id=\"ou_d13854a527652c37c068292c41c9f1d2\">Code Review Bot</at>",
              "[PR Review] %s opened PR" % actor,
              "Repo: %s" % repo,
              "Title: %s" % pr_title,
              "Changes: +%s -%s" % (adds, dels),
              "",
              "review %s" % pr_url,
          ]
          text = "\n".join(lines)

          headers = {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}
          payload = {
              'receive_id': '${{ secrets.FEISHU_CHAT_ID }}',
              'msg_type': 'text',
              'content': json.dumps({'text': text})
          }
          resp = requests.post(
              'https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id',
              headers=headers, json=payload
          )
          print('Feishu:', resp.status_code, resp.text[:500])
          PYEOF

      - name: Push — 通知 + 触发 Commit Review
        if: github.event_name == 'push'
        env:
          APP_ID: ${{ secrets.FEISHU_GIT_LISTENER_APP_ID }}
          APP_SECRET: ${{ secrets.FEISHU_GIT_LISTENER_APP_SECRET }}
          CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import requests, json, os

          token_resp = requests.post(
              'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal',
              json={'app_id': '${{ secrets.FEISHU_GIT_LISTENER_APP_ID }}',
                    'app_secret': '${{ secrets.FEISHU_GIT_LISTENER_APP_SECRET }}'}
          ).json()
          token = token_resp['tenant_access_token']

          ref_name = "${{ github.ref_name }}"
          repo = "${{ github.repository }}"
          actor = "${{ github.actor }}"

          lines = [
              "<at user_id=\"ou_d13854a527652c37c068292c41c9f1d2\">Code Review Bot</at>",
              "[Push] %s -> %s" % (actor, ref_name),
              "Repo: %s" % repo,
              "",
          ]

          # Parse commit details from event JSON
          event_path = os.environ.get('GITHUB_EVENT_PATH', '')
          if event_path:
              with open(event_path) as f:
                  event = json.load(f)
              commits = event.get('commits', [])
              if commits:
                  lines.append("Commits:")
                  for c in commits[:5]:
                      sha = c['id'][:7]
                      msg = c['message'].split('\n')[0][:80]
                      ts = c['timestamp'][:16].replace('T', ' ')
                      lines.append("  %s - %s (%s)" % (sha, msg, ts))
                  if len(commits) > 5:
                      lines.append("  ... +%d more" % (len(commits) - 5))
                  lines.append("")

          # Trigger review of the latest commit (use full SHA)
          head_commit = "${{ github.event.head_commit.id }}"
          if head_commit:
              lines.append("review commit %s in %s" % (head_commit, repo))

          text = "\n".join(lines)

          headers = {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}
          payload = {
              'receive_id': '${{ secrets.FEISHU_CHAT_ID }}',
              'msg_type': 'text',
              'content': json.dumps({'text': text})
          }
          resp = requests.post(
              'https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id',
              headers=headers, json=payload
          )
          print('Feishu:', resp.status_code, resp.text[:500])
          PYEOF
