name: Notify Code Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master, develop]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: PR — 通知 + 触发自动 Review
        if: github.event_name == 'pull_request'
        env:
          APP_ID: ${{ secrets.FEISHU_GIT_LISTENER_APP_ID }}
          APP_SECRET: ${{ secrets.FEISHU_GIT_LISTENER_APP_SECRET }}
          CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: |
          python3 -c "
          import requests, json

          token_resp = requests.post(
              'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal',
              json={'app_id': '$APP_ID', 'app_secret': '$APP_SECRET'}
          ).json()
          token = token_resp['tenant_access_token']

          pr_url = '${{ github.event.pull_request.html_url }}'
          pr_title = '${{ github.event.pull_request.title }}'.replace('\"', '\\\\\"')
          actor = '${{ github.actor }}'
          repo = '${{ github.repository }}'
          additions = '${{ github.event.pull_request.additions }}'
          deletions = '${{ github.event.pull_request.deletions }}'

          text = (
              f'[PR Review] {actor} opened PR\\n'
              f'Repo: {repo}\\n'
              f'Title: {pr_title}\\n'
              f'Changes: +{additions} -{deletions}\\n\\n'
              f'review {pr_url}'
          )

          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          payload = {
              'receive_id': '$CHAT_ID',
              'msg_type': 'text',
              'content': json.dumps({'text': text})
          }
          resp = requests.post(
              'https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id',
              headers=headers, json=payload
          )
          print('Feishu:', resp.status_code, resp.text[:500])
          "

      - name: Push — 通知
        if: github.event_name == 'push'
        env:
          APP_ID: ${{ secrets.FEISHU_GIT_LISTENER_APP_ID }}
          APP_SECRET: ${{ secrets.FEISHU_GIT_LISTENER_APP_SECRET }}
          CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: |
          python3 -c "
          import requests, json

          token_resp = requests.post(
              'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal',
              json={'app_id': '$APP_ID', 'app_secret': '$APP_SECRET'}
          ).json()
          token = token_resp['tenant_access_token']

          messages = '${{ toJson(github.event.commits) }}'
          import json as j; commits = j.loads(messages) if messages else []
          commit_list = '\\n'.join(
              f'  - {c[\"message\"].split(chr(10))[0][:80]} (@{c.get(\"author\",{}).get(\"username\",c.get(\"committer\",{}).get(\"username\",\"?\"))})'
              for c in commits[:5]
          )
          if len(commits) > 5:
              commit_list += f'\\n  ... +{len(commits)-5} more'

          text = f'[Push] ${{ github.actor }} -> ${{ github.ref_name }}\\nRepo: ${{ github.repository }}\\n\\n{commit_list}'

          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          payload = {
              'receive_id': '$CHAT_ID',
              'msg_type': 'text',
              'content': j.dumps({'text': text})
          }
          resp = requests.post(
              'https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id',
              headers=headers, json=payload
          )
          print('Feishu:', resp.status_code, resp.text[:500])
          "
